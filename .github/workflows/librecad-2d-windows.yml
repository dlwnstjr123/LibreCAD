# Fork-only Windows build, adapted from the official LibreCAD Windows x64 CI job.
# Original source: .github/workflows/build-all.yml (BuildWindows64).
name: LibreCAD 2D - Windows installer

on:
  push:
    branches:
      - feature/2d-windows-baseline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: librecad-2d-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  BuildWindows64:
    runs-on: windows-2022
    outputs:
      output1: ${{ steps.artifact-upload-step.outputs.artifact-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          host: 'windows'
          arch: 'win64_msvc2022_64'
          target: 'desktop'
          tools-only: 'false'
          modules: 'qt3d qt5compat qtimageformats qtshadertools'
          tools: 'tools_cmake'

      - name: (3) Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install boost
        run: |
          curl -# -L -o boost.7z https://archives.boost.io/release/1.87.0/source/boost_1_87_0.7z
          7z x -o. -y boost.7z
          mv boost_1_87_0 boost
          rm boost.7z
          pwd
          ls -ld boost/boost/version.hpp
        shell: bash

      - name: Configure CMake
        run: |
          cmake.exe -S . -B generated -G "Visual Studio 17 2022" -DBOOST_ROOT="%CD%\boost"
        shell: cmd
        env:
          BUILD_TYPE: release
          MSVC_VER_NUMBER: "Visual Studio 17 2022"
          # CMake reads CXXFLAGS from the environment; /MP compiles a project's files in parallel.
          CXXFLAGS: "/MP"

      - name: Build
        run: |
          cmake --build generated --config Release --parallel
        shell: cmd

      - name: listFile
        run: |
          cd generated
          dir *.*
          dir Release\*.*
        shell: cmd

      - name: List files
        run: |
            echo "${{ github.workspace }}"
            dir "${{ github.workspace }}"
        shell: cmd

      - name: Extract version (SCMREVISION)
        id: extract_version
        run: |
          $scmRevision = "2.2.2-alpha"
          if (Test-Path .git) {
            $out = (git describe --always 2>$null) | Out-String
            if ($LASTEXITCODE -eq 0 -and $out.Trim()) { $scmRevision = $out.Trim() }
          }

          # VIProductVersion must be X.X.X.X with each field <= 65535.
          # Parse `git describe` output: <major>.<minor>[.<patch>][-anything][-<commits>-g<sha>]
          $vi = "0.0.0.0"
          if ($scmRevision -match '^v?(\d+)\.(\d+)(?:\.(\d+))?[^-]*(?:-(\d+))?') {
            $major = $Matches[1]
            $minor = $Matches[2]
            $patch = if ($Matches[3]) { $Matches[3] } else { '0' }
            $build = if ($Matches[4]) { $Matches[4] } else { '0' }
            $vi = "$major.$minor.$patch.$build"
          }

          echo "SCMREVISION=$scmRevision" >> $env:GITHUB_ENV
          echo "VIProductVersion=$vi" >> $env:GITHUB_ENV
          echo "Extracted: SCMREVISION=$scmRevision, VIProductVersion=$vi"
        shell: pwsh

      - name: Generate custom.nsh and Deploy
        run: |
          cd "${{ github.workspace }}"
          powershell.exe -ExecutionPolicy Bypass -File scripts\generate-custom-nsh.ps1 -Architecture AMD64 -OutputPath "scripts\postprocess-windows\custom.nsh"

          cd generated
          windeployqt6.exe --release --compiler-runtime Release\LibreCAD.exe
          cd ..
          xcopy /E /Y /I generated\Release windows
          for /r generated %%f in (librecad_*.qm) do copy "%%f" librecad\ts\
          for /r generated %%f in (plugins_*.qm) do copy "%%f" plugins\ts\
          powershell.exe -ExecutionPolicy Bypass -File scripts\copy-vc-runtime.ps1 -Architecture AMD64 -Destination windows
          if errorlevel 1 exit /b 1
          set LC_ARCH=AMD64
          call "${{ github.workspace }}\scripts\build-nsis.bat"
        shell: cmd

      - name: Rename installer
        run: |
          mv generated/LibreCAD-*.exe LibreCAD-`git describe --always`-win-x64.exe
        shell: bash

      - name: Upload artifact
        id: artifact-upload-step
        uses: actions/upload-artifact@v4
        with:
          name: librecad-2d-win-x64
          path: LibreCAD*.exe
          retention-days: 14

